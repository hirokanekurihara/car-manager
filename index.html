<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="マイカー管理">
<title>マイカー管理アプリ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  body { font-family: 'Noto Sans JP', sans-serif; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .tab-btn.active { background-color: #2563eb; color: #fff; }
  .modal { display: none; }
  .modal.active { display: flex; }
  .fade-in { animation: fadeIn .15s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-24">

<header class="bg-blue-700 text-white shadow sticky top-0 z-30 px-4 py-3 flex justify-between items-center">
  <h1 class="text-lg sm:text-xl font-bold">🚗 マイカー管理</h1>
  <div>
    <button id="loginBtn" class="bg-white text-blue-700 px-3 py-1.5 rounded-lg font-bold text-sm hidden">🔑 Googleでログイン</button>
    <button id="logoutBtn" class="bg-blue-900 text-white px-3 py-1.5 rounded-lg font-bold text-sm hidden">ログアウト</button>
  </div>
</header>

<div id="unauthScreen" class="p-8 text-center mt-10 max-w-md mx-auto bg-white rounded-xl shadow-sm">
  <p class="text-4xl mb-3">🔒</p>
  <p class="font-bold mb-2">ログインしてください</p>
  <p class="text-sm text-slate-500">車両情報はGoogleアカウントに紐づけてクラウド（Cloud Firestore）に保存されます。同じアカウントで別デバイスからログインすれば同じデータを確認・編集できます。</p>
</div>

<main id="authScreen" class="max-w-5xl mx-auto px-3 sm:px-4 py-4 hidden space-y-4">

  <nav class="bg-white rounded-xl shadow-sm p-1.5 flex gap-1 text-xs sm:text-sm font-semibold">
    <button class="tab-btn active flex-1 py-2 rounded-lg" data-target="tab-cars">🚘 車両</button>
    <button class="tab-btn flex-1 py-2 rounded-lg" data-target="tab-fuel">⛽ 給油</button>
    <button class="tab-btn flex-1 py-2 rounded-lg" data-target="tab-maint">🔧 メンテ</button>
    <button class="tab-btn flex-1 py-2 rounded-lg" data-target="tab-settings">⚙️ 設定</button>
  </nav>

  <div class="bg-white p-3 rounded-xl shadow-sm flex items-center gap-2">
    <label class="text-sm font-bold text-slate-600 whitespace-nowrap">対象車両</label>
    <select id="globalCarSelect" class="flex-1 border border-slate-300 p-2 rounded-lg text-sm"></select>
  </div>

  <!-- 車両タブ -->
  <section id="tab-cars" class="tab-content active space-y-3">
    <button id="addCarBtn" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-bold text-sm">＋ 車両を追加（最大5台）</button>
    <div id="carList" class="grid sm:grid-cols-2 gap-3"></div>
  </section>

  <!-- 給油タブ -->
  <section id="tab-fuel" class="tab-content space-y-3">
    <div class="bg-white p-4 rounded-xl shadow-sm">
      <h3 class="font-bold mb-3 text-slate-700">＋ 給油記録を追加</h3>
      <div class="grid grid-cols-2 gap-2 text-sm">
        <input type="date" id="fDate" class="border border-slate-300 p-2 rounded-lg col-span-2">
        <input type="number" id="fOdo" placeholder="走行距離(km)" class="border border-slate-300 p-2 rounded-lg">
        <input type="number" id="fLiters" placeholder="給油量(L)" step="0.01" class="border border-slate-300 p-2 rounded-lg">
        <input type="number" id="fPrice" placeholder="金額(円)" class="border border-slate-300 p-2 rounded-lg">
        <label class="flex items-center gap-1 border border-slate-300 p-2 rounded-lg bg-slate-50 text-xs">
          <input type="checkbox" id="fFull" checked> 満タン
        </label>
        <div class="col-span-2 border border-slate-300 p-2 rounded-lg bg-slate-50 space-y-1">
  <button type="button" id="scanReceiptBtn" class="w-full bg-slate-600 text-white py-2 rounded-lg font-bold text-xs">
    🧾 レシートをスキャンして自動入力
  </button>
  <input type="file" id="fReceiptScan" accept="image/*" capture="environment" class="hidden">
  <p id="scanStatus" class="text-center text-xs text-slate-500 hidden"></p>
</div>
        <button id="saveFuelBtn" class="col-span-2 bg-blue-600 text-white py-2 rounded-lg font-bold">＋ 記録追加</button>
      </div>
    </div>
    <div id="fuelList" class="space-y-2"></div>
  </section>

  <!-- メンテタブ -->
  <section id="tab-maint" class="tab-content space-y-3">
    <div class="bg-white rounded-xl shadow-sm p-1.5 flex gap-1 text-xs font-semibold">
      <button class="maintSub active flex-1 py-1.5 rounded-lg" data-status="active">予約中・進行中</button>
      <button class="maintSub flex-1 py-1.5 rounded-lg" data-status="done">完了済み</button>
    </div>
    <button id="addMaintBtn" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-bold text-sm">＋ 新規予約・記録</button>
    <div id="maintListActive" class="space-y-2"></div>
    <div id="maintListDone" class="space-y-2 hidden"></div>
  </section>

  <!-- 設定タブ -->
  <section id="tab-settings" class="tab-content space-y-3">
    <div class="bg-white p-4 rounded-xl shadow-sm">
      <h3 class="font-bold mb-2 text-slate-700">作業カテゴリの管理</h3>
      <div class="flex gap-2 mb-3">
        <input type="text" id="newCategoryName" placeholder="新しいカテゴリ名" class="border border-slate-300 p-2 rounded-lg flex-1 text-sm">
        <button id="addCategoryBtn" class="bg-blue-600 text-white px-4 rounded-lg font-bold text-sm">追加</button>
      </div>
      <ul id="categoryList" class="text-sm divide-y divide-slate-100"></ul>
    </div>
    <div class="bg-white p-4 rounded-xl shadow-sm">
      <h3 class="font-bold mb-2 text-slate-700">店舗マスタの管理</h3>
      <div class="grid grid-cols-2 gap-2 mb-3">
        <input type="text" id="newShopName" placeholder="店舗名" class="border border-slate-300 p-2 rounded-lg text-sm">
        <input type="tel" id="newShopTel" placeholder="電話番号" class="border border-slate-300 p-2 rounded-lg text-sm">
        <button id="addShopBtn" class="col-span-2 bg-blue-600 text-white py-2 rounded-lg font-bold text-sm">店舗を追加</button>
      </div>
      <ul id="shopList" class="text-sm divide-y divide-slate-100"></ul>
    </div>
  </section>
</main>

<!-- 車両追加/編集モーダル -->
<div id="carModal" class="modal fixed inset-0 z-40 bg-black/50 items-center justify-center p-3">
  <div class="fade-in bg-white rounded-xl shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto p-5 space-y-3">
    <div class="flex justify-between items-center">
      <h2 class="font-bold text-lg">車両情報</h2>
      <button id="closeCarModal" class="text-2xl text-slate-400">&times;</button>
    </div>
    <input type="hidden" id="carDocId">
    <div class="grid grid-cols-2 gap-2 text-sm">
      <input type="text" id="cNickname" placeholder="ニックネーム*" class="border p-2 rounded-lg col-span-2">
      <input type="text" id="cMaker" placeholder="メーカー" class="border p-2 rounded-lg">
      <input type="text" id="cModel" placeholder="車種" class="border p-2 rounded-lg">
      <input type="number" id="cYear" placeholder="年式" class="border p-2 rounded-lg">
      <input type="text" id="cPlate" placeholder="ナンバー" class="border p-2 rounded-lg">
      <input type="number" id="cOdo" placeholder="現在の走行距離(km)" class="border p-2 rounded-lg col-span-2">
      <div><label class="text-xs text-slate-500">車検満了日</label><input type="date" id="cShaken" class="border p-2 rounded-lg w-full"></div>
      <div><label class="text-xs text-slate-500">自賠責満了日</label><input type="date" id="cJibai" class="border p-2 rounded-lg w-full"></div>
      <input type="text" id="cInsCompany" placeholder="任意保険会社名" class="border p-2 rounded-lg col-span-2">
      <input type="text" id="cInsStaff" placeholder="担当者名" class="border p-2 rounded-lg">
      <input type="tel" id="cInsTel" placeholder="担当者電話番号" class="border p-2 rounded-lg">
      <div><label class="text-xs text-slate-500">任意保険満了日</label><input type="date" id="cInsExpiry" class="border p-2 rounded-lg w-full"></div>
    </div>
    <button id="saveCarBtn" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-bold">保存する</button>
  </div>
</div>

<!-- メンテ追加/完了モーダル -->
<div id="maintModal" class="modal fixed inset-0 z-40 bg-black/50 items-center justify-center p-3">
  <div class="fade-in bg-white rounded-xl shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto p-5 space-y-3">
    <div class="flex justify-between items-center">
      <h2 class="font-bold text-lg">メンテナンス予約・記録</h2>
      <button id="closeMaintModal" class="text-2xl text-slate-400">&times;</button>
    </div>
    <input type="hidden" id="maintDocId">
    <div class="grid grid-cols-2 gap-2 text-sm">
      <select id="mCategory" class="border p-2 rounded-lg col-span-2"></select>
      <select id="mShop" class="border p-2 rounded-lg col-span-2"></select>
      <input type="text" id="mStaff" placeholder="担当者名" class="border p-2 rounded-lg col-span-2">
      <div><label class="text-xs text-slate-500">予約日</label><input type="date" id="mResDate" class="border p-2 rounded-lg w-full"></div>
      <div><label class="text-xs text-slate-500">予約時間</label><input type="time" id="mResTime" class="border p-2 rounded-lg w-full"></div>
      <input type="text" id="mMemo" placeholder="備考" class="border p-2 rounded-lg col-span-2">
      <hr class="col-span-2 my-1">
      <p class="col-span-2 text-xs text-slate-400">↓完了時に入力（未実施なら空欄でOK）</p>
      <div><label class="text-xs text-slate-500">実施日</label><input type="date" id="mDoneDate" class="border p-2 rounded-lg w-full"></div>
      <input type="number" id="mDoneOdo" placeholder="実施時ODO(km)" class="border p-2 rounded-lg">
      <input type="number" id="mCost" placeholder="実際の費用(円)" class="border p-2 rounded-lg">
      <input type="text" id="mWork" placeholder="作業内容" class="border p-2 rounded-lg">
      <div class="col-span-2"><label class="text-xs text-slate-500">次回予定日</label><input type="date" id="mNext" class="border p-2 rounded-lg w-full"></div>
    </div>
    <div class="flex gap-2">
      <button id="saveMaintReserveBtn" class="flex-1 bg-slate-200 text-slate-700 py-2.5 rounded-lg font-bold text-sm">予約として保存</button>
      <button id="saveMaintDoneBtn" class="flex-1 bg-green-600 text-white py-2.5 rounded-lg font-bold text-sm">✅ 完了にする</button>
    </div>
  </div>
</div>

<!-- レシート拡大表示モーダル -->
<div id="imgModal" class="modal fixed inset-0 z-50 bg-black/80 items-center justify-center p-3" onclick="this.classList.remove('active')">
  <img id="imgModalSrc" class="max-w-full max-h-full rounded-lg">
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, collection, doc, addDoc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, query, orderBy, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ★★★ ここをご自身のFirebase設定に書き換えてください ★★★
  const firebaseConfig = {
    apiKey: "AIzaSyD7fNdMoZBrzBKhQXDnQ2raUHI4KeDN674",
  authDomain: "my-car-manager-daab9.firebaseapp.com",
  projectId: "my-car-manager-daab9",
  storageBucket: "my-car-manager-daab9.firebasestorage.app",
  messagingSenderId: "287236190745",
  appId: "1:287236190745:web:caa18d35701205aa0db088"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  let currentUser = null;
  let currentCarId = null;

  const $ = (id) => document.getElementById(id);
  const loginBtn = $('loginBtn'), logoutBtn = $('logoutBtn');
  const unauthScreen = $('unauthScreen'), authScreen = $('authScreen');
  const globalCarSelect = $('globalCarSelect');

  // ---------- タブ切り替え ----------
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      e.currentTarget.classList.add('active');
      $(e.currentTarget.dataset.target).classList.add('active');
    });
  });
  document.querySelectorAll('.maintSub').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('.maintSub').forEach(b => b.classList.remove('active'));
      e.currentTarget.classList.add('active');
      $('maintListActive').classList.toggle('hidden', e.currentTarget.dataset.status !== 'active');
      $('maintListDone').classList.toggle('hidden', e.currentTarget.dataset.status !== 'done');
    });
  });

  // ---------- 認証 ----------
  loginBtn.addEventListener('click', () => signInWithRedirect(auth, new GoogleAuthProvider()));
  logoutBtn.addEventListener('click', () => signOut(auth));

  getRedirectResult(auth).catch((error) => {
    alert("ログインエラー\nコード: " + error.code + "\n内容: " + error.message);
  });

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      loginBtn.classList.add('hidden');
      logoutBtn.classList.remove('hidden');
      unauthScreen.classList.add('hidden');
      authScreen.classList.remove('hidden');
      await loadCategories();
      await loadShops();
      await loadCars();
    } else {
      currentUser = null;
      loginBtn.classList.remove('hidden');
      logoutBtn.classList.add('hidden');
      unauthScreen.classList.remove('hidden');
      authScreen.classList.add('hidden');
    }
  });

  // ---------- 共通：残り日数と色 ----------
  function daysUntil(dateStr) {
    if (!dateStr) return null;
    const t = new Date(dateStr); t.setHours(0,0,0,0);
    const n = new Date(); n.setHours(0,0,0,0);
    return Math.ceil((t - n) / 86400000);
  }
  function expiryColor(days) {
    if (days === null) return 'bg-slate-100 text-slate-400';
    if (days < 0) return 'bg-red-100 text-red-700';
    if (days <= 30) return 'bg-red-100 text-red-700';
    if (days <= 60) return 'bg-yellow-100 text-yellow-700';
    return 'bg-green-100 text-green-700';
  }
  function reserveColor(days) {
    if (days === null) return 'bg-slate-100 text-slate-400';
    if (days < 0) return 'bg-red-200 text-red-800';
    if (days <= 3) return 'bg-red-100 text-red-700';
    if (days <= 7) return 'bg-yellow-100 text-yellow-700';
    return 'bg-blue-100 text-blue-700';
  }

  // ---------- カテゴリ管理 ----------
  async function loadCategories() {
    const colRef = collection(db, `users/${currentUser.uid}/categories`);
    let snap = await getDocs(query(colRef, orderBy('createdAt')));
    if (snap.empty) {
      const defaults = ["オイル交換","タイヤ交換・ローテーション","バッテリー交換","ブレーキパッド交換",
        "エアフィルター交換","ワイパー交換","車検整備","定期点検（6ヶ月・12ヶ月）","板金・塗装","洗車・コーティング","その他"];
      for (const name of defaults) await addDoc(colRef, { name, createdAt: serverTimestamp() });
      snap = await getDocs(query(colRef, orderBy('createdAt')));
    }
    const listEl = $('categoryList'); const selectEl = $('mCategory');
    listEl.innerHTML = ''; selectEl.innerHTML = '';
    snap.forEach(d => {
      const data = d.data();
      const li = document.createElement('li');
      li.className = 'flex items-center gap-2 py-1.5';
      li.innerHTML = `
        <input type="text" value="${data.name}" data-id="${d.id}" class="catEditInput flex-1 border border-slate-200 rounded px-2 py-1 text-sm">
        <button class="catDelBtn text-red-500 text-xs font-bold px-2" data-id="${d.id}">削除</button>`;
      listEl.appendChild(li);
      const opt = document.createElement('option');
      opt.value = data.name; opt.textContent = data.name;
      selectEl.appendChild(opt);
    });
    listEl.querySelectorAll('.catEditInput').forEach(inp => {
      inp.addEventListener('change', async () => {
        await updateDoc(doc(db, `users/${currentUser.uid}/categories`, inp.dataset.id), { name: inp.value.trim() });
        loadCategories();
      });
    });
    listEl.querySelectorAll('.catDelBtn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('このカテゴリを削除しますか？')) return;
        await deleteDoc(doc(db, `users/${currentUser.uid}/categories`, btn.dataset.id));
        loadCategories();
      });
    });
  }
  $('addCategoryBtn').addEventListener('click', async () => {
    const name = $('newCategoryName').value.trim();
    if (!name) return;
    await addDoc(collection(db, `users/${currentUser.uid}/categories`), { name, createdAt: serverTimestamp() });
    $('newCategoryName').value = '';
    loadCategories();
  });

  // ---------- 店舗マスタ管理 ----------
  async function loadShops() {
    const colRef = collection(db, `users/${currentUser.uid}/shops`);
    const snap = await getDocs(query(colRef, orderBy('createdAt')));
    const listEl = $('shopList'); const selectEl = $('mShop');
    listEl.innerHTML = ''; selectEl.innerHTML = '<option value="">店舗を選択</option>';
    snap.forEach(d => {
      const data = d.data();
      const li = document.createElement('li');
      li.className = 'flex justify-between items-center py-1.5 text-sm';
      li.innerHTML = `<span>${data.name}（${data.tel || '-'}）</span>
        <button class="shopDelBtn text-red-500 text-xs font-bold" data-id="${d.id}">削除</button>`;
      listEl.appendChild(li);
      const opt = document.createElement('option');
      opt.value = d.id; opt.textContent = data.name;
      selectEl.appendChild(opt);
    });
    listEl.querySelectorAll('.shopDelBtn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('この店舗を削除しますか？')) return;
        await deleteDoc(doc(db, `users/${currentUser.uid}/shops`, btn.dataset.id));
        loadShops();
      });
    });
  }
  $('addShopBtn').addEventListener('click', async () => {
    const name = $('newShopName').value.trim();
    if (!name) return;
    await addDoc(collection(db, `users/${currentUser.uid}/shops`), {
      name, tel: $('newShopTel').value.trim(), createdAt: serverTimestamp()
    });
    $('newShopName').value = ''; $('newShopTel').value = '';
    loadShops();
  });

  // ---------- 車両管理 ----------
  $('addCarBtn').addEventListener('click', () => {
    $('carDocId').value = '';
    document.querySelectorAll('#carModal input').forEach(i => i.value = '');
    $('carModal').classList.add('active');
  });
  $('closeCarModal').addEventListener('click', () => $('carModal').classList.remove('active'));

  $('saveCarBtn').addEventListener('click', async () => {
    const nickname = $('cNickname').value.trim();
    if (!nickname) return alert('ニックネームは必須です');
    const data = {
      nickname, maker: $('cMaker').value, model: $('cModel').value,
      year: $('cYear').value, plate: $('cPlate').value,
      odo: Number($('cOdo').value) || 0,
      shaken: $('cShaken').value, jibai: $('cJibai').value,
      insCompany: $('cInsCompany').value, insStaff: $('cInsStaff').value,
      insTel: $('cInsTel').value, insExpiry: $('cInsExpiry').value,
      updatedAt: serverTimestamp()
    };
    const docId = $('carDocId').value;
    if (docId) {
      await updateDoc(doc(db, `users/${currentUser.uid}/cars`, docId), data);
    } else {
      const snap = await getDocs(collection(db, `users/${currentUser.uid}/cars`));
      if (snap.size >= 5) return alert('登録できる車両は5台までです');
      data.createdAt = serverTimestamp();
      await addDoc(collection(db, `users/${currentUser.uid}/cars`), data);
    }
    $('carModal').classList.remove('active');
    loadCars();
  });

  async function loadCars() {
    const snap = await getDocs(collection(db, `users/${currentUser.uid}/cars`));
    const list = $('carList');
    list.innerHTML = '';
    globalCarSelect.innerHTML = '';
    $('addCarBtn').disabled = snap.size >= 5;
    $('addCarBtn').classList.toggle('opacity-40', snap.size >= 5);

    snap.forEach(d => {
      const c = d.data();
      const opt = document.createElement('option');
      opt.value = d.id; opt.textContent = c.nickname;
      globalCarSelect.appendChild(opt);

      const shakenDays = daysUntil(c.shaken);
      const insDays = daysUntil(c.insExpiry);
      const div = document.createElement('div');
      div.className = 'bg-white p-4 rounded-xl shadow-sm text-sm space-y-1';
      div.innerHTML = `
        <h3 class="font-bold text-lg text-blue-700">${c.nickname}</h3>
        <p class="text-slate-500 text-xs">${c.maker||''} ${c.model||''} ${c.year? '('+c.year+'年)':''}</p>
        <p>走行距離: ${c.odo||0} km ／ ナンバー: ${c.plate||'-'}</p>
        <span class="inline-block px-2 py-0.5 rounded text-xs ${expiryColor(shakenDays)}">車検: ${c.shaken||'未設定'}${shakenDays!==null?`（残り${shakenDays}日）`:''}</span>
        <span class="inline-block px-2 py-0.5 rounded text-xs ${expiryColor(insDays)}">保険: ${c.insExpiry||'未設定'}${insDays!==null?`（残り${insDays}日）`:''}</span>
        ${c.insStaff? `<p class="text-xs">担当: ${c.insStaff} <a href="tel:${c.insTel}" class="text-blue-600 underline">${c.insTel||''}</a></p>`:''}

          <button class="editCarBtn text-blue-600 text-xs font-bold" data-id="${d.id}">編集</button>
          <button class="delCarBtn text-red-500 text-xs font-bold" data-id="${d.id}">削除</button>
        </div>`;
      list.appendChild(div);
    });

    list.querySelectorAll('.editCarBtn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const snap2 = await getDoc(doc(db, `users/${currentUser.uid}/cars`, btn.dataset.id));
        const c = snap2.data();
        $('carDocId').value = btn.dataset.id;
        $('cNickname').value = c.nickname||''; $('cMaker').value=c.maker||''; $('cModel').value=c.model||'';
        $('cYear').value=c.year||''; $('cPlate').value=c.plate||''; $('cOdo').value=c.odo||'';
        $('cShaken').value=c.shaken||''; $('cJibai').value=c.jibai||'';
        $('cInsCompany').value=c.insCompany||''; $('cInsStaff').value=c.insStaff||'';
        $('cInsTel').value=c.insTel||''; $('cInsExpiry').value=c.insExpiry||'';
        $('carModal').classList.add('active');
      });
    });
    list.querySelectorAll('.delCarBtn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('この車両を削除しますか？（関連する給油・メンテ記録は残ります）')) return;
        await deleteDoc(doc(db, `users/${currentUser.uid}/cars`, btn.dataset.id));
        loadCars();
      });
    });

    if (globalCarSelect.value) {
      currentCarId = globalCarSelect.value;
      loadFuel(); loadMaint();
    }
  }
  globalCarSelect.addEventListener('change', () => {
    currentCarId = globalCarSelect.value;
    loadFuel(); loadMaint();
  });

  // ---------- 給油記録（レシート撮影対応） ----------
  function compressImage(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const scale = Math.min(800 / img.width, 1);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', 0.7));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }
// ---------- レシートOCR：画像 → テキスト抽出 ----------
async function scanReceipt(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = async () => {
        try {
          // OCR精度向上のため、幅1200px程度にリサイズしてから認識にかける
          const canvas = document.createElement('canvas');
          const scale = Math.min(1200 / img.width, 1);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.85);

          // 日本語＋英数字を認識対象にする（数字だけでも日本語レシートは'jpn'指定が必須）
          const { data: { text } } = await Tesseract.recognize(dataUrl, 'jpn+eng');
          resolve(text);
        } catch (err) {
          reject(err);
        }
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---------- OCR結果のテキストから日付・給油量・金額を推測 ----------
function parseReceiptText(text) {
  console.log('OCRで読み取ったテキスト:\n', text);
  const result = {};

  // 日付：2026/08/13、2026-08-13、2026年8月13日 などに対応
  const dateMatch = text.match(/(\d{4})[\/\-年]\s*(\d{1,2})[\/\-月]\s*(\d{1,2})/);
  if (dateMatch) {
    const mm = dateMatch[2].padStart(2, '0');
    const dd = dateMatch[3].padStart(2, '0');
    result.date = `${dateMatch[1]}-${mm}-${dd}`;
  }

  // 給油量：35.5L、35.50ℓ などに対応（小数点付きの数値を優先）
  const litersMatch = text.match(/(\d{1,3}\.\d{1,2})\s*[LlℓＬ]/);
  if (litersMatch) result.liters = parseFloat(litersMatch[1]);

  // 金額：「合計」「小計」「請求」などのキーワード近くの数字を優先的に採用
  let amountMatch = text.match(/(?:合計|請求|お買上|お買い上げ|小計)[^\d]{0,6}([\d,]{3,7})/);
  if (!amountMatch) {
    // キーワードが見つからない場合は「¥」マーク付きの数字をフォールバックとして採用
    amountMatch = text.match(/[¥￥]\s*([\d,]{3,7})/);
  }
  if (amountMatch) result.amount = parseInt(amountMatch[1].replace(/,/g, ''), 10);

  return result;
}

// ---------- スキャンボタン押下時の処理 ----------
$('scanReceiptBtn').addEventListener('click', () => $('fReceiptScan').click());

$('fReceiptScan').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const statusEl = $('scanStatus');
  statusEl.textContent = '🔍 読み取り中…（10〜20秒ほどかかります）';
  statusEl.classList.remove('hidden');
  $('scanReceiptBtn').disabled = true;
  $('scanReceiptBtn').classList.add('opacity-50');

  try {
    const text = await scanReceipt(file);
    const parsed = parseReceiptText(text);

    if (parsed.date) $('fDate').value = parsed.date;
    if (parsed.liters) $('fLiters').value = parsed.liters;
    if (parsed.amount) $('fPrice').value = parsed.amount;

    if (parsed.date || parsed.liters || parsed.amount) {
      statusEl.textContent = '✅ 読み取り完了。内容を確認してください';
    } else {
      statusEl.textContent = '⚠️ うまく読み取れませんでした。手動で入力してください';
    }
  } catch (err) {
    console.error(err);
    statusEl.textContent = '❌ 読み取りに失敗しました。手動で入力してください';
  } finally {
    $('scanReceiptBtn').disabled = false;
    $('scanReceiptBtn').classList.remove('opacity-50');
    e.target.value = ''; // 同じ画像を再選択できるようにリセット
  }
});

  $('saveFuelBtn').addEventListener('click', async () => {
    if (!currentCarId) return alert('先に車両を選択してください');
    const date = $('fDate').value, odo = Number($('fOdo').value), liters = Number($('fLiters').value), price = Number($('fPrice').value);
    if (!date || !odo || !liters) return alert('日付・走行距離・給油量は必須です');

    // 燃費自動計算（直前の給油記録との差分から）
    const prevSnap = await getDocs(query(collection(db, `users/${currentUser.uid}/cars/${currentCarId}/fuelLogs`), orderBy('odometer', 'desc')));
    let efficiency = null;
    if (!prevSnap.empty) {
      const prevOdo = prevSnap.docs[0].data().odometer;
      if (odo > prevOdo) efficiency = Math.round(((odo - prevOdo) / liters) * 10) / 10;
    }

    let receiptImage = null;
    const file = $('fReceipt').files[0];
    if (file) receiptImage = await compressImage(file);

    await addDoc(collection(db, `users/${currentUser.uid}/cars/${currentCarId}/fuelLogs`), {
      date, odometer: odo, liters, amount: price, fullTank: $('fFull').checked,
      efficiency, receiptImage, createdAt: serverTimestamp()
    });
    await updateDoc(doc(db, `users/${currentUser.uid}/cars`, currentCarId), { odo });

    $('fOdo').value=''; $('fLiters').value=''; $('fPrice').value=''; $('fReceipt').value='';
    loadFuel(); loadCars();
  });

  async function loadFuel() {
    if (!currentCarId) return;
    const snap = await getDocs(query(collection(db, `users/${currentUser.uid}/cars/${currentCarId}/fuelLogs`), orderBy('date', 'desc')));
    const list = $('fuelList'); list.innerHTML = '';
    snap.forEach(d => {
      const f = d.data();
      const div = document.createElement('div');
      div.className = 'bg-white p-3 rounded-xl shadow-sm text-sm flex justify-between items-center';
      const img = f.receiptImage ? `<img src="${f.receiptImage}" class="w-12 h-12 object-cover rounded cursor-pointer receiptThumb">` : '';
      div.innerHTML = `
        <div><p class="font-bold">${f.date}</p>
        <p class="text-xs text-slate-500">ODO:${f.odometer}km ／ ${f.liters}L ／ ¥${f.amount}${f.efficiency?` ／ 燃費${f.efficiency}km/L`:''}</p></div>
        <div class="flex items-center gap-2">${img}<button class="delFuelBtn text-red-500 text-xs" data-id="${d.id}">×</button></div>`;
      list.appendChild(div);
      const thumb = div.querySelector('.receiptThumb');
      if (thumb) thumb.addEventListener('click', () => {
        $('imgModalSrc').src = f.receiptImage;
        $('imgModal').classList.add('active');
      });
    });
    list.querySelectorAll('.delFuelBtn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('削除しますか？')) return;
        await deleteDoc(doc(db, `users/${currentUser.uid}/cars/${currentCarId}/fuelLogs`, btn.dataset.id));
        loadFuel();
      });
    });
  }

  // ---------- メンテナンス（予約ステータス管理） ----------
  $('addMaintBtn').addEventListener('click', () => {
    if (!currentCarId) return alert('先に車両を選択してください');
    $('maintDocId').value = '';
    document.querySelectorAll('#maintModal input, #maintModal select').forEach(i => i.value = '');
    $('maintModal').classList.add('active');
  });
  $('closeMaintModal').addEventListener('click', () => $('maintModal').classList.remove('active'));

  async function saveMaint(status) {
    const data = {
      status,
      category: $('mCategory').value, shopId: $('mShop').value, staffName: $('mStaff').value,
      reservationDate: $('mResDate').value, reservationTime: $('mResTime').value, memo: $('mMemo').value,
      completedDate: $('mDoneDate').value, completedOdo: Number($('mDoneOdo').value)||null,
      actualCost: Number($('mCost').value)||null, workDetail: $('mWork').value, nextScheduleDate: $('mNext').value,
      updatedAt: serverTimestamp()
    };
    const docId = $('maintDocId').value;
    const colRef = collection(db, `users/${currentUser.uid}/cars/${currentCarId}/maintenanceLogs`);
    if (docId) {
      await updateDoc(doc(colRef, docId), data);
    } else {
      data.createdAt = serverTimestamp();
      await addDoc(colRef, data);
    }
    $('maintModal').classList.remove('active');
    loadMaint();
  }
  $('saveMaintReserveBtn').addEventListener('click', () => saveMaint('予約済み'));
  $('saveMaintDoneBtn').addEventListener('click', () => saveMaint('完了'));

  async function loadMaint() {
    if (!currentCarId) return;
    const snap = await getDocs(query(collection(db, `users/${currentUser.uid}/cars/${currentCarId}/maintenanceLogs`), orderBy('createdAt', 'desc')));
    const activeList = $('maintListActive'), doneList = $('maintListDone');
    activeList.innerHTML = ''; doneList.innerHTML = '';
    snap.forEach(d => {
      const m = d.data();
      const div = document.createElement('div');
      div.className = 'bg-white p-3 rounded-xl shadow-sm text-sm space-y-1';
      if (m.status === '完了') {
        div.innerHTML = `
          <p class="font-bold text-green-700">✅ ${m.category}</p>
          <p class="text-xs text-slate-500">実施日:${m.completedDate||'-'} ／ ¥${m.actualCost||0} ／ ${m.workDetail||''}</p>
          <button class="delMaintBtn text-red-500 text-xs" data-id="${d.id}">削除</button>`;
        doneList.appendChild(div);
      } else {
        const days = daysUntil(m.reservationDate);
        div.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <p class="font-bold">${m.category}</p>
              <p class="text-xs text-slate-500">${m.reservationDate||'未定'} ${m.reservationTime||''} ／ ${m.staffName||''}</p>
            </div>
            <span class="px-2 py-0.5 rounded text-xs ${reserveColor(days)}">${days!==null?(days<0?'期限超過':`残り${days}日`):'未予約'}</span>
          </div>
          <div class="flex gap-2 pt-1">
            <button class="editMaintBtn text-blue-600 text-xs font-bold" data-id="${d.id}">編集/完了にする</button>
            <button class="delMaintBtn text-red-500 text-xs" data-id="${d.id}">削除</button>
          </div>`;
        activeList.appendChild(div);
      }
    });
    document.querySelectorAll('.editMaintBtn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const snap2 = await getDoc(doc(db, `users/${currentUser.uid}/cars/${currentCarId}/maintenanceLogs`, btn.dataset.id));
        const m = snap2.data();
        $('maintDocId').value = btn.dataset.id;
        $('mCategory').value=m.category||''; $('mShop').value=m.shopId||''; $('mStaff').value=m.staffName||'';
        $('mResDate').value=m.reservationDate||''; $('mResTime').value=m.reservationTime||''; $('mMemo').value=m.memo||'';
        $('mDoneDate').value=m.completedDate||new Date().toISOString().slice(0,10);
        $('mDoneOdo').value=m.completedOdo||''; $('mCost').value=m.actualCost||''; $('mWork').value=m.workDetail||''; $('mNext').value=m.nextScheduleDate||'';
        $('maintModal').classList.add('active');
      });
    });
    document.querySelectorAll('.delMaintBtn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('削除しますか？')) return;
        await deleteDoc(doc(db, `users/${currentUser.uid}/cars/${currentCarId}/maintenanceLogs`, btn.dataset.id));
        loadMaint();
      });
    });
  }
</script>
